<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>DataCenter</title>
    <script>
      document.write(
        '<script src="/config/config.js?t=' + Date.now() + '"><\/script>'
      );
    </script>
    <script>
      window.APP_CONFIG = Object.assign(
        { baseApiUrl: "%VITE_APP_BASE_API%" },
        window.APP_CONFIG || {}
      );
    </script>
    <!--[if lt IE 11
      ]><script>
        window.location.href = "/html/ie.html";
      </script><!
    [endif]-->
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
      }

      body {
        background: #f5f5f5;
      }

      .boot-loader {
        display: flex;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #f5f5f5;
        color: #606266;
        opacity: 0;
        animation: reveal-loader 0s 250ms forwards;
      }

      .boot-loader__content {
        text-align: center;
      }

      .boot-loader__spinner {
        width: 34px;
        height: 34px;
        margin: 0 auto 14px;
        border: 3px solid rgba(24, 144, 255, 0.18);
        border-top-color: #1890ff;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      .boot-loader__text {
        font-size: 14px;
      }

      @media (prefers-color-scheme: dark) {
        body,
        .boot-loader {
          background: #0f1115;
          color: rgba(255, 255, 255, 0.65);
        }
      }

      @keyframes reveal-loader {
        to { opacity: 1; }
      }

      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-loader" aria-live="polite">
        <div class="boot-loader__content">
          <div class="boot-loader__spinner"></div>
          <div class="boot-loader__text">正在加载系统资源，请稍候</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
